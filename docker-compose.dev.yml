services:
  postgres:
    image: postgres:16-alpine
    container_name: ramadan_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ramadan_dev
    ports:
      - "5432:5432"
    volumes:
      - ramadan_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ramadan_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ramadan_dev_pgdata:
